# Application
spring.application.name=index-reviewer

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator: health, and info with the application version and Git revision
management.endpoints.web.exposure.include=health,info

# Business configuration (index definitions and review periods) lives in config/indices.yml.
# The packaged copy is the default; ./config/indices.yml next to the working directory overrides it.
spring.config.import=classpath:indices.yml,optional:file:./config/indices.yml

# Root folder of the input files; each review reads <data-dir>/<index>/<review period>/
index-reviewer.data-dir=./data

# Where each review run's report is stored as JSON: <reports-dir>/<index>/<review period>/<run id>.json
index-reviewer.reports-dir=./reports

# Display precision of review reports; calculations always run at full precision
index-reviewer.report.weight-decimals=6
index-reviewer.report.capping-factor-decimals=10
index-reviewer.report.ffmcap-decimals=2
