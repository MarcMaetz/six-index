# Application
spring.application.name=index-reviewer

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Business configuration (index definitions and review periods) lives in config/indices.yml (D11).
# The packaged copy is the default; ./config/indices.yml next to the working directory overrides it.
spring.config.import=classpath:indices.yml,optional:file:./config/indices.yml

# Root folder of the input files; each review reads <data-dir>/<index>/<review period>/ (D12)
index-reviewer.data-dir=./data
