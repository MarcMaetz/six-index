# Application
spring.application.name=index-reviewer

# OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Input data directory (spi_universe.csv, sec_data.csv, composition.csv)
index-reviewer.data-dir=./data

# SMI definition — kept in config so further indices / review dates can be added without code changes
index-reviewer.indices.SMI.universe=SPI
index-reviewer.indices.SMI.constituent-count=20
index-reviewer.indices.SMI.weight-cap=0.18
index-reviewer.indices.SMI.reviews.2026-Q3.cut-off-date=2026-09-10
index-reviewer.indices.SMI.reviews.2026-Q3.review-date=2026-09-21
