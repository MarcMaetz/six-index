plugins {
	id 'java'
	id 'jacoco'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.gorylenko.gradle-git-properties' version '4.0.1'
	id 'info.solidsoft.pitest' version '1.19.0'
	id 'net.ltgt.errorprone' version '5.1.1'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'SIX Index Reviewer - SMI review engine'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// CSV parsing
	implementation 'com.opencsv:opencsv:5.12.0'

	// OpenAPI / Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Architecture rules as tests
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Static analysis at compile time
	errorprone 'com.google.errorprone:error_prone_core:2.50.0'
}

// Error Prone warnings fail the build, so they get fixed (or suppressed with a reason) instead of scrolling by
tasks.withType(JavaCompile).configureEach {
	options.compilerArgs.add('-Werror')
}

// Package the business configuration (config/indices.yml) as the default copy on the classpath
tasks.named('processResources') {
	from('config') {
		include 'indices.yml'
	}
}

// Application version (build-info.properties) and Git revision (git.properties), recorded in every report and
// shown at /actuator/info. Without a Git checkout (e.g. a ZIP download) the build still works and the
// revision is "unknown".
springBoot {
	buildInfo()
}

gitProperties {
	failOnNoGitDirectory = false
	// Only what the report and /actuator/info use: no names, emails, hostname or remote URL in the jar
	keys = ['git.branch', 'git.commit.id', 'git.commit.id.abbrev', 'git.commit.time', 'git.dirty']
}

tasks.named('test') {
	useJUnitPlatform()
}

// Mutation testing of the review logic: ./gradlew pitest, report in build/reports/pitest. Not part of build.
pitest {
	pitestVersion = '1.30.0'
	junit5PluginVersion = '1.2.3'
	// The plugin's own launcher (1.x) clashes with Spring Boot's JUnit 6; use the managed one from testRuntimeOnly
	addJUnitPlatformLauncher = false
	targetClasses = ['com.example.indexreviewer.review.*']
	// Report tests too: they read the review result the way the report does
	targetTests = ['com.example.indexreviewer.review.*', 'com.example.indexreviewer.report.*']
	mutators = ['STRONGER']
	threads = 4
	outputFormats = ['HTML', 'XML']
	timestampedReports = false
}

// Line and branch coverage: ./gradlew test jacocoTestReport, report in build/reports/jacoco. Not a gate.
tasks.named('jacocoTestReport') {
	dependsOn tasks.named('test')
	reports {
		xml.required = true
		html.required = true
	}
}
