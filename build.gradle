plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.gorylenko.gradle-git-properties' version '4.0.1'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'
description = 'SIX Index Reviewer - SMI review engine'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// CSV parsing
	implementation 'com.opencsv:opencsv:5.12.0'

	// OpenAPI / Swagger UI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.0'

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	// Architecture rules as tests (D30)
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.1'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Package the business configuration (config/indices.yml) as the default copy on the classpath (D11)
tasks.named('processResources') {
	from('config') {
		include 'indices.yml'
	}
}

// Application version (build-info.properties) and Git revision (git.properties), recorded in every report and
// shown at /actuator/info (D31). Without a Git checkout (e.g. a ZIP download) the build still works and the
// revision is "unknown".
springBoot {
	buildInfo()
}

gitProperties {
	failOnNoGitDirectory = false
	// Only what the report and /actuator/info use: no names, emails, hostname or remote URL in the jar
	keys = ['git.branch', 'git.commit.id', 'git.commit.id.abbrev', 'git.commit.time', 'git.dirty']
}

tasks.named('test') {
	useJUnitPlatform()
}
